services:
  api:
    build: ./server
    image: peter-server
    command: [ "node", "dist/api.js" ]
    env_file: .env
    environment:
      DATA_DIR: /data
    ports: [ "3001:3001" ]
    volumes: [ "data:/data" ]
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 5s
      retries: 10

  agent:
    build: ./server
    image: peter-server
    command: [ "node", "dist/agent.js", "start" ]
    env_file: .env
    environment:
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy

  client:
    build: ./client
    image: peter-client
    ports: [ "3000:80" ]
    depends_on: [ api ]

volumes:
  data:
